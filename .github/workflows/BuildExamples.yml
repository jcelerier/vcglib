name: BuildExamples

on:
  [push, pull_request]

jobs:
  ubuntu_build_tests:
    name: Build Examples
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']

    steps:
    - uses: actions/checkout@v4
    - name: Install Qt
      if: runner.os != 'macOS'
      uses: jurplel/install-qt-action@v3
      with:
        cache: true
        version: '5.15.2'
        # Only trimesh_texture, space_packer and space_rasterized_packer use Qt,
        # and only Qt5::OpenGL (part of qtbase) and Qt5::Svg. Restricting the
        # archives skips ~20 unused ones - including the QtMultimedia archive
        # whose corrupt download was failing the Windows job outright.
        archives: qtbase qtsvg
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Setup env Linux
      if: runner.os == 'Linux'
      run: |
        sudo apt-get install -y ninja-build
    - name: Setup env macOS
      if: runner.os == 'macOS'
      run: |
        brew install ninja qt5
    - name: Build Samples
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          export Qt5_DIR=$(brew --prefix qt5)
        fi
        mkdir build
        cd build
        cmake -GNinja -DVCG_BUILD_EXAMPLES=ON ..
        ninja
